<style>
:root{--bg:#efe6d4;--fg:#2a2140;--btn:#2a2140;--btnfg:#efe6d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:min(100%,960px,calc((100vh - 140px)*1.7778));width:min(100%,960px,calc((100dvh - 140px)*1.7778));border:4px solid var(--fg);cursor:pointer}

#mkic{position:absolute;right:64px;bottom:10px;z-index:3;width:44px;height:44px;display:grid;place-items:center;padding:0;border:3px solid #fff;background:rgba(20,10,50,.75);color:#fff;cursor:pointer}

.rb:disabled{opacity:.4;cursor:default}

#hop{bottom:96px;background:#8cd8ff}
#buyl{bottom:140px;background:#7dff8c}
#buyl:disabled{opacity:.55;cursor:default}
</style></head><body>

 width='2' height='3' fill='#e8445a'/><rect x='3' y='2' width='2' height='3' fill='#fff'/><rect x='5' y='2' width='2' height='3' fill='#e8445a'/><rect x='7' y='2' width='2' height='3' fill='#fff'/><rect x='9' y='2' width='2' height='3' fill='#e8445a'/><rect x='11' y='2' width='2' height='3' fill='#fff'/><rect x='13' y='2' width='2' height='3' fill='#e8445a'/><rect x='2' y='5' width='1' height='9' fill='#c8a070'/><rect x='13' y='5' width='1' height='9' fill='#c8a070'/><rect x='2' y='10' width='12' height='2' fill='#c8a070'/><rect x='2' y='12' width='12' height='2' fill='#6a4226'/><rect x='5' y='8' width='5' height='2' fill='#2f8ccc'/><rect x='10' y='7' width='2' height='1' fill='#2f8ccc'/><rect x='10' y='9' width='2' height='1' fill='#2f8ccc'/></svg></button><div id='shop'><div id='shh'><span>GEAR SHOP</span><button id='shx'>CLOSE</button></div><div id='shc'></div><div id='shl'></div></div><button id='hop'></button><button id='buyl'></button><div id='cash'></div><button id='buyz'></button><div id='mk'><div id='mkh'>FISH MARKET</div><div id='mkc'></div><div id='mkl'></div><button id='mks'>GEAR SHOP</button><button id='mkz'></button><button id='mkb'>BACK TO FISHING</button></div><div id='warn'>! BITE !</div><div id='catch'><div>YOU CAUGHT A</div><canvas id='fc' width='44' height='24'></canvas><b id='cname'></b><div id='cinfo'></div><div id='cgo'><button id='brel'>RELEASE</button><button id='besk'>ESKY</button></div></div><button id='book' aria-label='Fish book'><svg viewBox='0 0 16 16' width='26' height='26' shape-rendering='crispEdges'><rect x='2' y='1' width='12' height='14' fill='#2f8ccc'/><rect x='2' y='1' width='2' height='14' fill='#1b4f8a'/><rect x='5' y='3' width='8' height='10' fill='#f4ead2'/><rect x='6' y='6' width='5' height='2' fill='#2a58b8'/><rect x='11' y='5' width='1' height='4' fill='#2a58b8'/><rect x='6' y='10' width='5' height='1' fill='#8a90a8'/></svg></button><div id='dex'><div id='dexh'></div><div id='dexl'></div><div id='dexx'>CLOSE</div></div>
<div id="start"><div><b>SEA DRIVE ’86</b>CLICK OR PRESS ANY KEY<br>ARROWS / WASD TO SAIL</div></div></div>
<div id="pad"><button data-a="L">LEFT</button><button data-a="R">RIGHT</button><button data-a="U">GAS</button><button data-a="D">BRAKE</button><button id='mkbtn'>MARKET</button></div>
<script>
const W=320,H=180,HZ=84,F=W/2/Math.tan(.7),CH=1.5,TAU=Math.PI*2,SA=.9,TS=200;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud');
cv.width=W;cv.height=H;
const img=ctx.createImageData(W,H),buf=new Uint32Array(img.data.buffer);
const P=h=>{const n=parseInt(h.slice(1),16);return 0xff000000|(n&255)<<16|(n>>8&255)<<8|n>>16};
const O=['#12408a','#1b63b0','#2f8ccc','#a9e4f2'].map(P),FOG=P('#8cc8e6');
const SKY=['#ffd9a0','#ffbd80','#f9a08c','#e8809c','#c2689f','#8f58a0','#60499a','#41387e','#2b2a62'];
const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const ca=[],XS=[];for(let x=0;x<W;x++){XS[x]=(x-W/2+.5)/F;ca[x]=Math.atan(XS[x])}
const far=a=>6+18*(1-Math.abs(Math.sin(2*a+1)))+10*(1-Math.abs(Math.sin(5*a+2)))+3*Math.sin(13*a);
const near=a=>4+12*(1-Math.abs(Math.sin(3*a+.5)))+8*(1-Math.abs(Math.sin(7*a+1.3)))+2*Math.sin(19*a);
const wrapA=d=>((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
const rel=v=>((v%TS)+TS*1.5)%TS-TS/2;
const R=(x,y,w,h)=>ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const bu=[];for(let i=0;i<0;i++)bu.push({x:rnd()*TS,z:rnd()*TS});

let t=0,px=0,pz=6,hd=0,sp=0,roll=0,bump=0,wk=0,last=0,wake=[],sch=[],nextS=20,mode=0,mph=0,tgt=null,lure=null,rt=0,rl=null;
const A={},M={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',ArrowDown:'D',s:'D'};
const start=()=>document.getElementById('start').style.display='none';
const key=e=>M[e.key.length>1?e.key:e.key.toLowerCase()];
addEventListener('keydown',e=>{start();const a=key(e);if(a){A[a]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const a=key(e);if(a)A[a]=0});
addEventListener('blur',()=>{for(const k in A)A[k]=0});
document.getElementById('wrap').addEventListener('pointerdown',start);
document.querySelectorAll('#pad button').forEach(b=>{
  const a=b.dataset.a,on=e=>{e.preventDefault();start();A[a]=1},off=()=>{A[a]=0};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off));
});

function update(dt){
  const tn=(A.R?1:0)-(A.L?1:0);
  sp+=(A.U?ENG[eT].v*.4375:A.D?-9:0)*dt;sp-=sp*.35*dt;sp=mode>3?0:Math.max(-4,Math.min(ENG[eT].v,sp));
  hd+=tn*1.2*Math.min(1,Math.abs(sp)/4)*(sp<0?-1:1)*dt;
  roll+=(tn*Math.min(1,sp/8)-roll)*6*dt;
  px+=Math.sin(hd)*sp*dt;pz+=Math.cos(hd)*sp*dt;
  {const lim=zones*100;if(pz>lim-2){pz=lim-2;sp*=.3}if(pz<3){pz=3;sp*=.3}}
  bump=Math.max(0,bump-dt);
  if(!bump)for(const b of bu){const dx=rel(b.x-px),dz=rel(b.z-pz);if(dx*dx+dz*dz<1.6){sp=-sp*.4;bump=.35;break}}
  wk+=dt;
  if(Math.abs(sp)>1&&wk>.04){wk=0;const s=Math.sin(hd),c=Math.cos(hd);
    for(const k of[-1,1])wake.push({x:px-s*1.6+c*k*.5,z:pz-c*1.6-s*k*.5,l:1});
    if(wake.length>120)wake.splice(0,wake.length-120)}
  for(const p of wake)p.l-=dt/1.3;
  wake=wake.filter(p=>p.l>0);
  for(const h of sch){h.age+=dt;h.x+=h.vx*dt;h.z+=h.vz*dt}
  sch=sch.filter(h=>h.age<h.life);
  if(Math.abs(sp)>3&&(nextS-=dt)<=0){nextS=45+Math.random()*45;if(!sch.length)mkSchool()}
  if(mode==2||mode==5)mph+=dt;
  if(mode==1){const m1=sch.length?'TAP A BUST FOR TUNA OR ANY SPOT':'TAP ANY SPOT TO CAST - FIND A BUST FOR TUNA';if(msg.textContent!=m1)msg.textContent=m1}
  if(mode==5)ah+=((A.R?1:0)-(A.L?1:0))*dt;
  if(mode==3&&(rt-=dt)<=0)startReel();
  walkTick(dt);netTick(dt);
  cash.textContent=mny(money)+String.fromCharCode(10)+'OUT '+Math.max(0,Math.round(pz))+' / '+zones*100+' M'+(ws?String.fromCharCode(10)+'ONLINE '+(Object.keys(others).length+1):'');
  {const nz=zones<10&&(mode==0||mode==1||mode==2||mode==5)&&pz>zones*100-15;buyz.style.display=nz?'block':'none';
    if(nz){buyz.textContent='BORDER! UNLOCK '+zones*100+'-'+(zones*100+100)+' M  '+mny(ZP[zones]);buyz.disabled=money<ZP[zones]}}
  const r=mode==4&&rl;
  if(r){
    if(r.st==0){r.age+=dt;r.ca+=dt*9;r.d=Math.max(3,r.d0*(1-r.age/7));
      if(r.hook&&r.age>=r.bt){r.st=1;r.biteAt=performance.now();msg.textContent=''}
      else if(!r.hook&&r.age>=7)fail('NOTHING BITING HERE - TRY A NEW SPOT')}
    else if(r.st==1){if(performance.now()-r.biteAt>r.win)fail('IT GOT AWAY - TOO SLOW!')}
    else if(r.st==2){
      if(r.sgOn){if((r.sgT-=dt)<=0){r.sgOn=0;r.sgN=2.5+Math.random()*2}}
      else if(r.pw>.2&&(r.sgN-=dt)<=0){r.sgOn=1;r.sgT=.8+2.2*r.pw}
      r.p-=r.dec*.75*(r.sgOn?1.8+.2*r.pw:1)*r.fury*ROD[rT].rd*dt;r.sh=(2+5*r.pw)*(r.sgOn?2:1);
      r.d=Math.max(3,r.dB*(1-r.p*.9));
      const tx=r.sgOn?'IT IS RUNNING! TAP TAP TAP!':r.fury>1?'MONSTER FIGHTER! CLICK FASTER!':'CLICK AS FAST AS YOU CAN!';
      if(msg.textContent!=tx)msg.textContent=tx;
      if(r.p<=0)fail('THE FISH SHOOK THE HOOK!')}
    else if(r.st==3&&(r.ft-=dt)<=0)endReel();
    else if(r.st==4&&!r.ok&&(r.ct-=dt)<=0){r.ok=1;cgo.style.visibility='visible'}
  }
}

function render3(){
  const s=Math.sin(hd),c=Math.cos(hd),cx=px-s*5,cz=pz-c*5;
  // sky
  for(let i=0;i<9;i++){ctx.fillStyle=SKY[i];R(0,HZ-10*(i+1),W,10)}
  // sun
  const dA=wrapA(SA-hd);
  if(Math.abs(dA)<1.3){const sx=W/2+F*Math.tan(dA),sy=HZ-26;
    for(let dy=-14;dy<=14;dy++){if(dy>2&&dy%4==0)continue;
      ctx.fillStyle=dy<-5?'#fff2a8':dy<3?'#ffd45e':'#ff9a5a';
      const h=Math.sqrt(196-dy*dy);R(sx-h,sy+dy,h*2,1)}}
  // clouds
  ctx.fillStyle='#ffd9c0';
  for(let i=0;i<6;i++){const d=wrapA(i*1.05+t*.01-hd);
    if(Math.abs(d)<1.3){const x=W/2+F*Math.tan(d),y=14+(i*17)%34,w=22+(i%3)*8;R(x-w/2,y,w,3);R(x-w/2+5,y-2,w-12,2)}}
  // mountains
  const mt=(x,h,h2,sl,lit,shd,sn,sns)=>{h=Math.round(h/2)*2;const l=h2<h;
    ctx.fillStyle=l?lit:shd;R(x,HZ-h,1,h);
    if(h>sl){ctx.fillStyle=l?sn:sns;R(x,HZ-h,1,h-sl)}};
  for(let x=0;x<W;x++){const a=hd+ca[x];
    mt(x,far(a),far(a+.03),28,'#9a70bd','#7a55a4','#ffe9d8','#d8b9d6')}

// ===== species icons, land blocks, walking, multiplayer client =====
const fcv=[];
const fishCv=si=>fcv[si]||(fcv[si]=(()=>{const k=document.createElement('canvas');k.width=44;k.height=24;paintFish(SP[si][1],k);return k})());
function drawFishIcon(X,Y,si,k,fl){ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(X,Y);ctx.scale(fl*k,k);ctx.drawImage(fishCv(si),8,5,28,16,-9,-5,18,10);ctx.restore()}
function jumpFish(x,y,len,fc,pt,si){ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(x,y);ctx.rotate(-pt*.6*fc);ctx.scale(fc,1);ctx.drawImage(fishCv(si),8,5,28,16,-len/2,-len*.29,len,len*.57);ctx.restore()}
const BS=40,BZ0=50,BP=50000,bAt=(x,z)=>z<=-BZ0&&z>=-BZ0-BS?Math.floor(x/BS):null;
let gx=0,gz=0,gh=0,gw=0,owners={},myPid='me',myName='YOU',myCol='#e8445a',others={},ws=null,nT=0;
if(!window.MP_ON){try{owners=JSON.parse(localStorage.getItem('seadrive-land')||'{}')}catch(e){}}
const hop=document.getElementById('hop'),buyl=document.getElementById('buyl');
const saveLand=()=>{if(!window.MP_ON)try{localStorage.setItem('seadrive-land',JSON.stringify(owners))}catch(e){}};
function buyBlock(i){
  if(owners[i]||money<BP)return;
  if(window.MP_ON){if(ws&&ws.readyState==1)ws.send(JSON.stringify({t:'buy',i}));return}
  owners[i]={pid:myPid,n:myName,c:myCol};money-=BP;saveG();saveLand();
}
hop.addEventListener('pointerdown',e=>{e.stopPropagation();start();if(mode==7)setMode(0);else if(mode==0){gx=px;gz=.5;gh=0;setMode(7);hud.textContent=''}});
buyl.addEventListener('pointerdown',e=>{e.stopPropagation();const i=bAt(gx,gz);if(i!=null)buyBlock(i)});
function walkTick(dt){
  hop.style.display=(mode==0&&pz<14)||mode==7?'block':'none';hop.textContent=mode==7?'BACK TO BOAT':'HOP OUT AND WALK';
  if(mode!=7){buyl.style.display='none';return}
  const dx=(A.R?1:0)-(A.L?1:0),dz=(A.U?1:0)-(A.D?1:0);
  if(dx||dz){const n=Math.hypot(dx,dz),sx=dx/n*7*dt,sz=dz/n*7*dt,fr=(x,z)=>{const i=bAt(x,z),o=i==null?null:owners[i];return!o||o.pid==myPid};
    gh=Math.atan2(dx,dz);if(fr(gx+sx,gz))gx+=sx;if(fr(gx,gz+sz))gz+=sz;gz=Math.min(1,Math.max(-400,gz));gw+=dt*10}
  const i=bAt(gx,gz),o=i==null?null:owners[i];
  buyl.style.display=i!=null&&!o?'block':'none';
  if(i!=null&&!o){buyl.textContent='BUY BLOCK '+i+'  '+mny(BP);buyl.disabled=money<BP}
  const m2=i==null?'WALK INLAND - BLOCKS START 50 M FROM THE SHORE':!o?'FOR SALE - 40 M X 40 M':o.pid==myPid?'YOUR BLOCK':'OWNED BY '+o.n;
  if(msg.textContent!=m2)msg.textContent=m2;
}
function drawLand(){
  const S2=3,bx=W/2,by=H/2;
  for(let y=0;y<H;y+=2){const wz=gz+(by-y)/S2;
    for(let x=0;x<W;x+=2){const wx=gx+(x-bx)/S2,
      col=wz<-30?GR[(Math.floor(wx/4)+Math.floor(wz/4))&1]:wz<-3?SD[(Math.floor(wx/3)+Math.floor(wz/3))&1]:wz<0?WS:wz<2.5?(Math.sin(wz*2.2-t*1.4+Math.sin(wx*.35)*2)>.8?FM:O[2]):(Math.sin(wx*.9+Math.sin(wz*.5+t*.8)*1.2)+Math.sin(wz*1.1-t*1.1+Math.sin(wx*.4)*1.3)>.9?O[1]:O[0]),i=y*W+x;
      buf[i]=buf[i+1]=buf[i+W]=buf[i+W+1]=col}}
  ctx.putImageData(img,0,0);ctx.font='6px monospace';
  for(let i=Math.floor((gx-60)/BS);i<=Math.floor((gx+60)/BS);i++){
    const x0=bx+(i*BS-gx)*S2,y0=by-(-BZ0-gz)*S2,x1=x0+BS*S2,y1=y0+BS*S2,o=owners[i];
    if(x1<0||x0>W||y1<0||y0>H)continue;
    if(o){ctx.fillStyle='#c8a070';R(x0,y0,BS*S2,1);R(x0,y1,BS*S2,1);R(x0,y0,1,BS*S2);R(x1,y0,1,BS*S2+1);
      ctx.fillStyle='#6a4226';for(let k=0;k<=BS;k+=5){const d=k*S2;R(x0+d-1,y0-1,3,3);R(x0+d-1,y1-1,3,3);R(x0-1,y0+d-1,3,3);R(x1-1,y0+d-1,3,3)}
      ctx.fillStyle=o.c;R(x0-1,y0-8,2,8);R(x0+1,y0-8,7,4);ctx.fillStyle='#fff';ctx.fillText(o.n,x0+4,y0+10)}
    else{ctx.fillStyle='#fff';ctx.globalAlpha=.55;for(let k=0;k<=BS;k+=4){const d=k*S2;R(x0+d,y0,1,1);R(x0+d,y1,1,1);R(x0,y0+d,1,1);R(x1,y0+d,1,1)}ctx.globalAlpha=1;ctx.fillText('FOR SALE',x0+BS*S2/2-20,y0+BS*S2/2)}
  }
  const bX=bx+(px-gx)*S2,bY=by-(pz-gz)*S2;ctx.fillStyle='#d83a4e';R(bX-6,bY-3,12,6);ctx.fillStyle='#f4ead2';R(bX-3,bY-2,6,3);
  for(const id in others){const o=others[id],X=bx+(o.x-gx)*S2,Y=by-(o.z-gz)*S2;
    if(o.w)person(X,Y+7,o.c,t*10);else{ctx.fillStyle=o.c;R(X-6,Y-3,12,6)}
    ctx.fillStyle='#fff';ctx.fillText(o.n,X-o.n.length*1.6,Y-12)}
  person(bx,by+7,myCol,gw);
}
function drawOthers(cx,cz,s,c){
  for(const id in others){const o=others[id];if(o.w)continue;
    const dx=o.x-cx,dz=o.z-cz,zz=dx*s+dz*c;if(zz<2||zz>110)continue;
    const sx=W/2+(dx*c-dz*s)/zz*F,sy=HZ+CH*F/zz,u=F/zz;
    ctx.globalAlpha=1-Math.min(1,Math.max(0,(zz-8)/110))*.8;
    ctx.fillStyle=o.c;R(sx-u*.7,sy-u*.55,u*1.4,u*.5);ctx.fillStyle='#f4ead2';R(sx-u*.35,sy-u,u*.7,u*.5);ctx.fillStyle='#fff';R(sx-u*.75,sy-u*.1,u*1.5,u*.12);
    if(zz<70){ctx.font='6px monospace';ctx.fillText(o.n,sx-o.n.length*1.6,sy-u*1.2)}
    ctx.globalAlpha=1}
}
function drawOthersTop(){
  const bx=W/2,by=H/2;ctx.font='6px monospace';
  for(const id in others){const o=others[id],X=bx+(o.x-px)*S,Y=by-(o.z-pz)*S;
    if(X<-10||X>W+10||Y<-10||Y>H+10)continue;
    ctx.fillStyle=o.c;R(X-3,Y-3,6,6);ctx.fillStyle='#fff';R(X-1,Y-1,2,2);ctx.fillText(o.n,X-o.n.length*1.6,Y-6)}
}
function netTick(dt){
  for(const id in others){const o=others[id],k=Math.min(1,dt*10);o.x+=(o.tx-o.x)*k;o.z+=(o.tz-o.z)*k}
  if(!ws||ws.readyState!=1||(nT+=dt)<.1)return;
  nT=0;ws.send(JSON.stringify({t:'pos',x:mode==7?gx:px,z:mode==7?gz:pz,h:mode==7?gh:hd,w:mode==7?1:0}));
}
function connect(){
  if(!window.MP_ON)return;
  let nm='',tok='';try{nm=localStorage.getItem('seadrive-name')||'';tok=localStorage.getItem('seadrive-tok')||''}catch(e){}
  if(!nm){nm=(prompt('Your name for this server?','')||'Player').slice(0,14);try{localStorage.setItem('seadrive-name',nm)}catch(e){}}
  if(!tok){tok=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('seadrive-tok',tok)}catch(e){}}
  myName=nm;
  const w=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);ws=w;
  w.onopen=()=>w.send(JSON.stringify({t:'hi',n:nm,tok}));
  w.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}
    if(d.t=='init'){myPid=d.pid;myCol=d.c;owners=d.owners||{};others={};for(const p of d.players)others[p.id]={...p,tx:p.x,tz:p.z}}
    else if(d.t=='join')others[d.id]={id:d.id,n:d.n,c:d.c,x:0,z:6,tx:0,tz:6,h:0,w:0}
    else if(d.t=='leave')delete others[d.id];
    else if(d.t=='snap'){for(const[id,x,z,h,wk]of d.p){const o=others[id];if(o){o.tx=x;o.tz=z;o.h=h;o.w=wk}}}
    else if(d.t=='own'){if(d.o)owners[d.i]=d.o;else delete owners[d.i]}
    else if(d.t=='buyres'&&d.ok){money-=BP;saveG()}};
  w.onclose=()=>{ws=null;others={};setTimeout(connect,3000)};
}
connect();
setMode(0);

// esky (max 5): release or keep buttons, esky list inside the fish book
let esky=[];try{esky=JSON.parse(localStorage.getItem('seadrive-esky')||'[]').filter(f=>f&&SP[f.si]&&f.L>0).slice(0,5)}catch(e){}
const saveEsky=()=>{try{localStorage.setItem('seadrive-esky',JSON.stringify(esky))}catch(e){}};
const brel=document.getElementById('brel'),besk=document.getElementById('besk');
function eskyBtn(){const f=esky.length>=5;besk.disabled=f;besk.textContent=f?'ESKY FULL 5/5':'KEEP IN ESKY '+esky.length+'/5'}
brel.addEventListener('pointerdown',e=>{e.stopPropagation();if(rl&&rl.ok)endReel()});
besk.addEventListener('pointerdown',e=>{e.stopPropagation();if(rl&&rl.ok&&esky.length<5){esky.push({L:rl.L,si:rl.si});saveEsky();endReel()}});
function showDex(){
  const a=dex.slice().sort((x,y)=>sc(y)-sc(x));
  dexh.textContent='FISH BOOK - '+a.length+' CAUGHT';dexl.textContent='';
  const row=(f,txt,btn)=>{const r=document.createElement('div'),c=document.createElement('canvas'),s=document.createElement('span');
    r.className='dr';c.width=44;c.height=24;paintFish(SP[f.si][1],c);
    s.textContent=txt+SP[f.si][0]+String.fromCharCode(10)+szs(f.L)+'  /  '+kgs(f.L,f.si);r.append(c,s);if(btn)r.append(btn);dexl.append(r)};
  const head=t=>{const d=document.createElement('div');d.textContent=t;d.className='dh2';dexl.append(d)};
  head('ESKY '+esky.length+'/5'+(esky.length?'':' - EMPTY'));
  esky.forEach((f,i)=>{const b=document.createElement('button');b.textContent='RELEASE';b.className='rb';
    b.addEventListener('pointerdown',e=>{e.stopPropagation();esky.splice(i,1);saveEsky();showDex()});row(f,'',b)});
  head('ALL CATCHES - BEST FIRST');
  a.forEach((f,i)=>row(f,'#'+(i+1)+(i?'':' BEST')+' '));
  dexEl.style.display='flex';
}

function loop(ms){
  const dt=Math.min(.05,(ms-last)/1000||0);last=ms;t+=dt;
  update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
